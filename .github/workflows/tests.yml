name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04  # setup-python has no Python 3.9 for Ubuntu 26.04, the newer ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: The installed package carries the viewer's page and its token form
        working-directory: ${{ runner.temp }}
        run: python -c "from swarmchat import view; print(len(view.page()['body']), len(view.gate()['body']), 'bytes')"
      - name: Tests
        run: python -m unittest discover -s tests -v
