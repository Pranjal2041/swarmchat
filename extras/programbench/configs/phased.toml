# For the first 40 minutes nobody writes the program: the team writes a spec and tests. Then it builds.
name = "phased8"
tasks = ["sitkevij__hex.61ae69b"]       # ProgramBench task ids. README.md lists the ten in the blog post.
hours = 6                              # agent time per task
snapshot_minutes = 30                  # save the submission this often, to score it over time. 0 for never.
parallel = 1                           # tasks run at once
loop = true                            # each time an agent ends its turn early, send it back to work

[agent]
# The agent's command-line tool, a Linux x86_64 build. It is mounted read-only into each container.
kind = "claude"                        # claude, codex or command
binary = "~/.local/bin/claude"
model = "claude-opus-5-5"
effort = "xhigh"
# For Codex instead:
# kind = "codex"
# binary = "~/agents/codex"
# model = "gpt-6-luna"
# effort = "xhigh"

[team]
members = 8

[team.phase]
minutes = 40                           # {{phase_minutes}} in a prompt
loop = "../prompts/phased-loop.md"     # what sends an agent back to work during the phase
notice = "../prompts/phased-over.md"   # what every agent is told when it ends

[[team.roles]]
name = "members"
prompt = "../prompts/phased.md"
